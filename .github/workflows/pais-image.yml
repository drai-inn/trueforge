name: pais-image

# PAIS (University of Auckland) deployment image for TrueForge on the ai-gpu-test cluster, built from
# this fork's pais/* branches only: an upstream release plus patches not yet released upstream. Mirrors
# upstream's release image build (repository Dockerfile with its defaults, linux/amd64) and publishes to
# ghcr.io/drai-inn/trueforge. The tag names the upstream version and our patch level; bump PAIS_TAG with
# each change and pin it in drai-inn/ai-gpu-deployment clusters/ai-gpu-test/trueforge/values.yaml.
on:
  push:
    branches: ['pais/**']
  workflow_dispatch:

env:
  PAIS_TAG: 0.178.0-mcp-resource.1

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.PAIS_TAG }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ env.PAIS_TAG }}
            org.opencontainers.image.description=TrueForge with PAIS patches not yet released upstream

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record published image
        run: |
          echo "### pais image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}:${{ env.PAIS_TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
